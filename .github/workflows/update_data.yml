name: Auto Update Portal Data

on:
  schedule:
    # 2시간마다 전 세계 축구 일정 및 4차 산업 뉴스 자동 최신화
    - cron: '0 */2 * * *'
  workflow_dispatch: # 관리자가 수동 실행 가능

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Fetch and build portal data
        run: |
          python build_portal_data.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update portal and global data [skip ci]" && git push)
