<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS / SKADI - System Observability Dashboard</title>
    <!-- FontAwesome 아이콘 & Chart.js CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* =====================================================================
           🎨 1. 테마 & 글로벌 스타일링 (Cyberpunk / JARVIS HUD Dark Theme)
        ===================================================================== */
        :root {
            --bg-primary: #0a0d14;
            --bg-card: rgba(18, 24, 38, 0.85);
            --bg-card-hover: rgba(26, 35, 54, 0.95);
            --border-glow: rgba(0, 242, 254, 0.25);
            --cyan-glow: #00f2fe;
            --purple-glow: #7928ca;
            --green-glow: #00ff87;
            --red-glow: #ff0055;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(121, 40, 202, 0.05) 0%, transparent 40%);
        }

        /* 헤더 스타일 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-glow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 28px;
            color: var(--cyan-glow);
            filter: drop-shadow(0 0 8px var(--cyan-glow));
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--cyan-glow), #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 135, 0.1);
            border: 1px solid var(--green-glow);
            color: var(--green-glow);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--green-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green-glow);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        /* 그리드 레이아웃 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }

        /* 카드 기본 스타일 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            border-color: var(--cyan-glow);
            box-shadow: 0 8px 32px rgba(0, 242, 254, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 메트릭 카드 수치 */
        .metric-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .metric-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* 프로그레스 바 */
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .fill-cyan { background: linear-gradient(90deg, #4facfe, var(--cyan-glow)); }
        .fill-purple { background: linear-gradient(90deg, #7928ca, #ff0080); }
        .fill-green { background: linear-gradient(90deg, #00b09b, var(--green-glow)); }

        /* 볼륨 슬라이더 및 컨트롤 버튼 */
        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
        }

        .slider {
            flex: 1;
            accent-color: var(--cyan-glow);
            height: 6px;
            cursor: pointer;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--cyan-glow);
            color: var(--cyan-glow);
        }

        /* 실시간 이벤트 로그 터미널 */
        .log-terminal {
            background: #05070a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            height: 220px;
            overflow-y: auto;
            color: #a9b7c6;
            line-height: 1.6;
        }

        .log-line {
            display: flex;
            gap: 10px;
            margin-bottom: 4px;
        }

        .log-time { color: #6272a4; }
        .log-tag-rag { color: var(--cyan-glow); }
        .log-tag-llm { color: #f1fa8c; }
        .log-tag-sys { color: var(--green-glow); }
    </style>
</head>
<body>

    <!-- 🌟 상단 헤더 -->
    <header>
        <div class="brand">
            <i class="fa-solid fa-brain brand-icon"></i>
            <div>
                <h1 class="brand-title">JARVIS CORE OBSERVABILITY</h1>
                <p style="font-size: 12px; color: var(--text-muted);">통합 에이전트 & 시스템 관측 대시보드</p>
            </div>
        </div>
        <div class="status-badge">
            <div class="pulse-dot"></div>
            <span id="server-status">ONLINE (Port 8000)</span>
        </div>
    </header>

    <!-- 📊 메인 그리드 대시보드 -->
    <div class="dashboard-grid">

        <!-- 1. CPU 메트릭 -->
        <div class="card" style="grid-column: span 3;">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-microchip"></i> CPU Usage</span>
                <span id="cpu-cores" class="metric-sub">0 Cores</span>
            </div>
            <div id="cpu-val" class="metric-value">--%</div>
            <div class="progress-bar-bg">
                <div id="cpu-bar" class="progress-bar-fill fill-cyan" style="width: 0%;"></div>
            </div>
        </div>

        <!-- 2. GPU 메트릭 (4080 Super) -->
        <div class="card" style="grid-column: span 3;">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-bolt"></i> NVIDIA GPU</span>
                <span id="gpu-temp" class="metric-sub">--°C</span>
            </div>
            <div id="gpu-util" class="metric-value">--%</div>
            <div class="progress-bar-bg">
                <div id="gpu-bar" class="progress-bar-fill fill-green" style="width: 0%;"></div>
            </div>
            <div id="vram-sub" class="metric-sub" style="margin-top: 8px;">VRAM: -- / -- MB</div>
        </div>

        <!-- 3. RAM 메트릭 -->
        <div class="card" style="grid-column: span 3;">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-memory"></i> RAM Usage</span>
                <span id="ram-used" class="metric-sub">-- / -- GB</span>
            </div>
            <div id="ram-val" class="metric-value">--%</div>
            <div class="progress-bar-bg">
                <div id="ram-bar" class="progress-bar-fill fill-purple" style="width: 0%;"></div>
            </div>
        </div>

        <!-- 4. OS 빠른 제어 패널 -->
        <div class="card" style="grid-column: span 3;">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-sliders"></i> OS Control</span>
            </div>
            <div class="control-group">
                <i class="fa-solid fa-volume-high" style="color: var(--cyan-glow);"></i>
                <input type="range" id="vol-slider" min="0" max="100" value="50" class="slider" onchange="setVolume(this.value)">
                <span id="vol-text" style="font-size: 13px; width: 35px;">50%</span>
            </div>
            <div class="control-group" style="margin-top: 12px; gap: 8px; flex-wrap: wrap;">
                <button class="btn-action" onclick="mediaAction('play-pause')"><i class="fa-solid fa-play"></i> 재생/정지</button>
                <button class="btn-action" onclick="mediaAction('next')"><i class="fa-solid fa-forward"></i> 다음</button>
                <button class="btn-action" onclick="lockScreen()"><i class="fa-solid fa-lock"></i> 잠금</button>
            </div>
        </div>

        <!-- 5. LLM 모델 라우팅 통계 차트 -->
        <div class="card" style="grid-column: span 6;">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-chart-pie"></i> LLM Orchestration Distribution</span>
            </div>
            <div style="height: 220px; position: relative;">
                <canvas id="llmChart"></canvas>
            </div>
        </div>

        <!-- 6. 실시간 RAG & 에이전트 이벤트 스트림 로그 -->
        <div class="card" style="grid-column: span 6;">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-terminal"></i> Live Observability Stream</span>
                <span class="metric-sub">Auto-refresh (2s)</span>
            </div>
            <div id="event-log" class="log-terminal">
                <div class="log-line"><span class="log-time">[SYSTEM]</span> <span class="log-tag-sys">관측성 파이프라인이 정상 시작되었습니다.</span></div>
            </div>
        </div>

    </div>

    <!-- =====================================================================
         📜 2. 실시간 데이터 폴링 및 인터랙션 자바스크립트
    ===================================================================== -->
    <script>
        const API_BASE = window.location.origin;

        // 1. Chart.js 차트 초기화
        const ctx = document.getElementById('llmChart').getContext('2d');
        const llmChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Gemini 2.5/3.5', 'Claude 3.7', 'GPT-4o', 'Ollama (Local)'],
                datasets: [{
                    data: [45, 30, 15, 10],
                    backgroundColor: ['#4facfe', '#7928ca', '#00ff87', '#f1fa8c'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right', labels: { color: '#8b949e', font: { size: 12 } } }
                }
            }
        });

        // 2. 실시간 하드웨어 메트릭 폴링 (2초 주기)
        async function updateMetrics() {
            try {
                const res = await fetch(`${API_BASE}/api/system/metrics`);
                if (!res.ok) return;
                const data = await res.json();

                // CPU
                document.getElementById('cpu-val').innerText = `${data.cpu.usage_pct}%`;
                document.getElementById('cpu-bar').style.width = `${data.cpu.usage_pct}%`;
                document.getElementById('cpu-cores').innerText = `${data.cpu.cores_logical} Cores`;

                // RAM
                document.getElementById('ram-val').innerText = `${data.ram.usage_pct}%`;
                document.getElementById('ram-bar').style.width = `${data.ram.usage_pct}%`;
                document.getElementById('ram-used').innerText = `${data.ram.used_gb} / ${data.ram.total_gb} GB`;

                // GPU
                if (data.gpu.available && data.gpu.gpus.length > 0) {
                    const gpu = data.gpu.gpus[0];
                    document.getElementById('gpu-util').innerText = `${gpu.gpu_utilization_pct}%`;
                    document.getElementById('gpu-bar').style.width = `${gpu.gpu_utilization_pct}%`;
                    document.getElementById('gpu-temp').innerText = `${gpu.temperature_c}°C`;
                    document.getElementById('vram-sub').innerText = `VRAM: ${gpu.vram_used_mb} / ${gpu.vram_total_mb} MB (${gpu.vram_usage_pct}%)`;
                }
            } catch (e) {
                console.warn('Metrics polling error:', e);
            }
        }

        // 3. OS 컨트롤 함수들
        async function setVolume(val) {
            document.getElementById('vol-text').innerText = `${val}%`;
            await fetch(`${API_BASE}/api/system/volume/set`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ level: parseInt(val) })
            });
            appendLog('SYS', `마스터 볼륨이 ${val}%로 변경되었습니다.`);
        }

        async function mediaAction(action) {
            await fetch(`${API_BASE}/api/system/media/${action}`, { method: 'POST' });
            appendLog('SYS', `미디어 액션 실행: ${action}`);
        }

        async function lockScreen() {
            await fetch(`${API_BASE}/api/system/action/lock`, { method: 'POST' });
            appendLog('SYS', '화면 잠금을 요청했습니다.');
        }

        // 4. 로그 터미널 추가 함수
        function appendLog(type, message) {
            const terminal = document.getElementById('event-log');
            const now = new Date().toTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.className = 'log-line';
            div.innerHTML = `<span class="log-time">[${now}]</span> <span class="log-tag-${type.toLowerCase()}">[${type}] ${message}</span>`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // 초기 실행 및 타이머 등록
        setInterval(updateMetrics, 2000);
        updateMetrics();
    </script>
</body>
</html>
