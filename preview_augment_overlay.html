                    },
                    {

                    }
                ]
            },
            adc: {
                champion: "이즈리얼",
                reroll_status: "HOLD",
                reroll_title: "[2번 슬롯 즉시 확정]",
                reroll_reason: "종결 [S티어] 초월 의식 96.5점 확보! 리롤 아끼기 🔒",
                cards: [
                    {
                        slot: 1,
                        tier: "A",
                        name: "되풀이",

                    },
                    {
                        slot: 2,
                        tier: "S",

                        gold: ""
                    }
                ]
            }
        };

        function updateRerollBar(status, title, reason) {
            const bar = document.getElementById("rerollGuideBar");
            const icon = document.getElementById("rerollIcon");
            const titleEl = document.getElementById("rerollTitle");
            const reasonEl = document.getElementById("rerollReason");
            const badgeEl = document.getElementById("rerollCountBadge");
            const btnEl = document.getElementById("btnExecuteReroll");

            bar.className = `reroll-guide-bar reroll-${status}`;
            titleEl.innerText = title;
            reasonEl.innerText = reason;
            badgeEl.innerText = `주사위(리롤): ${currentRerolls} / 1 남음`;

            if (currentRerolls <= 0) {
                bar.className = "reroll-guide-bar reroll-EXHAUSTED";
                icon.innerText = "🔒";
                titleEl.innerText = "[리롤 기회 소진]";
                btnEl.style.opacity = "0.4";
                btnEl.style.pointerEvents = "none";
                btnEl.innerText = "🚫 리롤 소진됨";
            } else {
                btnEl.style.opacity = "1";
                btnEl.style.pointerEvents = "auto";
                btnEl.innerText = "🎲 전체 리롤";
                icon.innerText = status === "RECOMMENDED" || status === "SLOT_REROLL" ? "🚨 🎲" : "🔒";
            }
        }

        function renderCards() {
            const data = PRESETS[currentActiveKey];
            updateRerollBar(data.reroll_status, data.reroll_title, data.reroll_reason);

            const container = document.getElementById("cardsContainer");
            container.innerHTML = "";

            data.cards.forEach((c, idx) => {
                const col = document.createElement("div");
                col.className = "augment-column";

                const recClass = c.rec ? " recommended" : "";
                
                let actionBadge = "";
                if (c.rec) {
                    actionBadge = `<span class="badge-rec-star">★ 1순위 추천</span>`;
                } else if (c.reroll_rec) {
                    actionBadge = `<span class="badge-slot-reroll">🎲 단독 리롤 권장</span>`;
                } else {
                    actionBadge = `<span class="badge-slot-keep">🔒 킵 (보존)</span>`;
                }

                const rerollBtnDisabled = currentRerolls <= 0 ? " disabled" : "";

                col.innerHTML = `
                    <!-- 1. 상단 오버레이 배너 -->
                    <div class="overlay-banner${recClass}">
                        <div class="tier-badge tier-${c.tier}">${c.tier}</div>
                        <div class="banner-info">
                            <div class="banner-title-row">
                                <span style="display: flex; align-items: center;">
                                    <span class="slot-index-badge">${idx + 1}번</span>
                                    <span class="banner-name">${c.name}</span>
                                </span>
                                ${actionBadge}
                            </div>
                            <div class="banner-meta">
                                <span>증강 점수 <span class="score-val">${c.score}</span></span>
                                <span>•</span>
                                <span>${c.pref}</span>
                            </div>
                        </div>
                    </div>

                    <!-- 2. 하단 인게임 카드 모형 -->
                    <div class="ingame-card-mock">
                        <div class="card-inner-frame"></div>
                        <div class="card-icon-frame">${c.icon}</div>
                        <div class="card-title">${c.name}</div>
                        <div class="card-tag">${c.tag}</div>
                        <div class="card-desc">${c.desc}</div>
                        ${c.gold ? `<div class="card-gold">${c.gold}</div>` : ""}
                    </div>

                    <!-- 3. 개별 카드 단독 리롤 버튼 -->
                    <button class="btn-slot-reroll${rerollBtnDisabled}" onclick="rerollSingleSlot(${idx})">
                        🎲 ${idx + 1}번 슬롯만 단독 리롤
                    </button>
                `;
                container.appendChild(col);
            });
        }

        function loadPreset(key) {
            currentActiveKey = key;
            document.querySelectorAll(".btn-preset").forEach(btn => {
                if (btn.id !== "btnExecuteReroll") btn.classList.remove("active");
            });
            if (event && event.target && event.target.id !== "btnExecuteReroll") {
                event.target.classList.add("active");
            }
            renderCards();
        }

        // 🎲 개별 슬롯 단독 리롤 실행 함수
        function rerollSingleSlot(slotIdx) {
            if (currentRerolls <= 0) {
                alert("남은 리롤 기회가 없습니다! (0/1)");
                return;
            }

            currentRerolls = 0;
            const data = PRESETS[currentActiveKey];

            // 해당 슬롯만 단독으로 OP티어 양손잡이로 교체
            data.cards[slotIdx] = {
                slot: slotIdx + 1,
                tier: "OP",
                name: "양손잡이 (리롤 대박!)",
                score: "98.5",
                pref: "선호도 압도적 최상",
                rec: true,
                reroll_rec: false,
                icon: "⚡",
                tag: "공격 속도 / 온힛",
                desc: "공격 속도가 100% 증가하고 모든 공격 시 쪼개기 피해와 추가 적중 피해가 적용됩니다.",
                gold: ""
            };

            // 다른 슬롯들의 rec 해제
            data.cards.forEach((c, i) => {
                if (i !== slotIdx) {
                    c.rec = false;
                    c.reroll_rec = false;
                }
            });

            data.reroll_status = "EXHAUSTED";
            data.reroll_title = `[${slotIdx + 1}번 슬롯 단독 리롤 대성공!]`;
            data.reroll_reason = `다른 슬롯은 유지되고, ${slotIdx + 1}번 슬롯에 [OP티어 양손잡이] 등장! 즉시 확정하세요!`;

            renderCards();
        }

        // 전체 리롤 시뮬레이션
        function simulateRerollClick() {
            if (currentRerolls <= 0) return;
            currentRerolls = 0;
            loadPreset("op_tier");
            updateRerollBar("EXHAUSTED", "[전체 리롤 성공! OP티어 등장]", "1회 리롤 소모 완료 (0/1). OP티어 양손잡이를 즉시 선택하세요!");
        }

        // 초기 로딩 (Image 6)
        loadPreset("image6");
    </script>
